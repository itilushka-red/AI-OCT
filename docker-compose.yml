services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oct-backend
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend-ai-projectv2/ai-webpage
      dockerfile: Dockerfile
    container_name: oct-frontend
    ports:
      - "3003:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: oct-network
